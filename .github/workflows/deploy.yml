name: Deploy to GitHub Pages and Tencent Cloud

# 推到 main 即构建并同步发布到 GitHub Pages 与腾讯云；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留一次发布，新推送取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 内容 schema / i18n / base 前缀等单测，防止带着坏内容发布
      - run: pnpm test
      - name: Build GitHub Pages site
        run: pnpm build
      - name: Build Tencent Cloud root-path site
        run: |
          mv dist dist-github
          pnpm build:tencent
          mv dist dist-tencent
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github
      - uses: actions/upload-artifact@v4
        with:
          name: tencent-site
          path: dist-tencent
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-tencent:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tencent-site
          path: tencent-site
      - name: Configure SSH
        env:
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Sync static site to Tencent Cloud
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
        run: |
          rsync -az --checksum --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            tencent-site/ "$TENCENT_USER@$TENCENT_HOST:/home/ubuntu/my_web/"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$TENCENT_USER@$TENCENT_HOST" \
            'test -s /home/ubuntu/my_web/index.html'
